# ============================================================
# 政策知识库 · Docker Compose 生产编排
#
# 用法：
#   cd feishu-webapp
#   cp .env.production.example .env      # 填真实值
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f app
#   docker compose -f deploy/docker-compose.yml ps        # 看健康状态
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: policy-kb:latest
    container_name: policy-kb
    restart: always

    # 只监听本机，由 Nginx 反代对外；若改由容器直连外网请删除 127.0.0.1 前缀
    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - ../.env

    environment:
      NODE_ENV: production
      PORT: "3000"

    volumes:
      # db.json 持久化（审核单/订阅/采集队列/待同步 outbox 全在里面，丢了=丢写）
      - app-data:/app/data

    # 容器内的日志轮转，避免 node 输出把磁盘打满
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── 可选：让 Nginx 也跑在容器里（用 --profile with-nginx 启用）──────────
  # 若不启用，请在宿主机上按 deploy/nginx/policy-kb.conf 部署 Nginx
  nginx:
    profiles: ["with-nginx"]
    image: nginx:1.27-alpine
    container_name: policy-kb-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/policy-kb.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"

volumes:
  app-data:
  nginx-cache:
