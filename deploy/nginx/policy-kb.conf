# ============================================================
# 政策知识库 · Nginx 反向代理（生产）
#
# 安装：
#   sudo cp deploy/nginx/policy-kb.conf /etc/nginx/conf.d/policy-kb.conf
#   sudo sed -i 's/policy.yourdomain.com/你的真实域名/g' /etc/nginx/conf.d/policy-kb.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书：sudo certbot --nginx -d 你的域名
# ============================================================

upstream policy_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── HTTP：ACME 校验放行，其余全部跳 HTTPS ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name policy.yourdomain.com;

    # certbot 的 http-01 校验必须能访问到，否则续期会失败
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name policy.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/policy.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/policy.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # HSTS：确认不会再退回 http 后再启用（启用后半年内不可逆）
    # add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # ── 安全头 ───────────────────────────────────────────────────────
    # 关键：飞书客户端/网页端会在 iframe 或内嵌容器里打开本应用，
    # 所以绝不能设 X-Frame-Options: DENY/SAMEORIGIN，否则页面白屏。
    # 改用 CSP frame-ancestors 精确放行飞书域。
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.feishu.cn https://*.feishu-pre.net https://*.larksuite.com; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 10m;

    # ── 压缩 ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # ── 方案 B：改由 Nginx 直接托管前端静态文件（省一层 Node）────────────
    # 默认走方案 A（Node 托管自建前端：总览首页 / + 审批台 /admin/），此时下面两行保持注释即可。
    # 若要切到方案 B：
    #   1. 把 policy-api/public 整个拷到 /var/www/policy-kb/web/
    #   2. 取消下面两行注释（放在 server 块内、location 之外）
    #   3. Node 只负责 /api、/auth 与 /healthz
    # root /var/www/policy-kb/web;
    # try_files $uri $uri/ /index.html;

    # 健康检查：不走认证，不记日志
    location = /healthz {
        proxy_pass http://policy_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── 静态资源（自建前端 /app/ 与审批台 /admin/ 的 JS/CSS/图片；缓存头由 Node 控制）──
    location ~* ^/(app|admin)/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        proxy_pass http://policy_app;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ── 主代理（API / OAuth / 自建前端页面）─────────────────────────────
    location / {
        proxy_pass http://policy_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;

        # OAuth 回调地址与 Secure Cookie 判定都依赖这个头，缺了会登录失败
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_buffering off;

        # Bitable 聚合 10 张表偶尔较慢
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    access_log /var/log/nginx/policy-kb.access.log;
    error_log  /var/log/nginx/policy-kb.error.log warn;
}
