# 反向代理示例：https://policy.yourdomain.com → 本机 :3000
# 飞书回调强制 HTTPS，生产必须套证书（certbot 免费签发）

upstream policy_app {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name policy.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/policy.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/policy.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # gzip 静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # 静态资源（自建前端 /app/ 与审批台 /admin/，缓存由 Node 按 1h 控制）
    location ~* ^/(app|admin)/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        proxy_pass http://policy_app;
        proxy_set_header Host $host;
    }

    # 健康检查不走认证
    location = /healthz {
        proxy_pass http://policy_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # 主代理
    location / {
        proxy_pass http://policy_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OAuth 回调依赖这些头拼 redirect_uri
        proxy_redirect off;

        # 超时（Bitable API 有时慢）
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }
}

server {
    listen 80;
    server_name policy.yourdomain.com;
    return 301 https://$host$request_uri;
}
